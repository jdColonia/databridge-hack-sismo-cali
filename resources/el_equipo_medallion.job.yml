# Job serverless: sin clusters ni job_clusters (las notebook tasks usan serverless por defecto)
resources:
  jobs:
    el_equipo_medallion:
      name: el_equipo_medallion
      tasks:
        - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/setup/setup_volume.py
            base_parameters: &params
              catalog: ${var.catalog}
              schema: ${var.schema}
              raw_schema: ${var.raw_schema}
              team: ${var.team}
              volume: ${var.volume}

        - task_key: bronze_hackathon_buildings
          depends_on:
            - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/bronze/bronze_hackathon_buildings.py
            base_parameters: *params

        - task_key: bronze_idesc_references
          depends_on:
            - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/bronze/bronze_idesc_references.py
            base_parameters: *params

        - task_key: bronze_idesc_seismic_zones
          depends_on:
            - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/bronze/bronze_idesc_seismic_zones.py
            base_parameters: *params

        - task_key: bronze_idesc_facilities
          depends_on:
            - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/bronze/bronze_idesc_facilities.py
            base_parameters: *params

        - task_key: bronze_usgs_context
          depends_on:
            - task_key: setup_volume
          notebook_task:
            notebook_path: ../src/bronze/bronze_usgs_context.py
            base_parameters: *params

        - task_key: silver_references
          depends_on:
            - task_key: bronze_idesc_references
          notebook_task:
            notebook_path: ../src/silver/silver_references.py
            base_parameters: *params

        - task_key: silver_buildings
          depends_on:
            - task_key: bronze_hackathon_buildings
            - task_key: silver_references
          notebook_task:
            notebook_path: ../src/silver/silver_buildings.py
            base_parameters: *params

        - task_key: silver_neighborhood_crosswalk
          depends_on:
            - task_key: silver_buildings
          notebook_task:
            notebook_path: ../src/silver/silver_neighborhood_crosswalk.py
            base_parameters: *params

        - task_key: silver_seismic_zones
          depends_on:
            - task_key: bronze_idesc_seismic_zones
            - task_key: silver_buildings
          notebook_task:
            notebook_path: ../src/silver/silver_seismic_zones.py
            base_parameters: *params

        - task_key: silver_facilities
          depends_on:
            - task_key: bronze_idesc_facilities
            - task_key: silver_buildings
          notebook_task:
            notebook_path: ../src/silver/silver_facilities.py
            base_parameters: *params

        - task_key: gold_map_and_summaries
          depends_on:
            - task_key: silver_seismic_zones
            - task_key: silver_facilities
            - task_key: silver_neighborhood_crosswalk
          notebook_task:
            notebook_path: ../src/gold/gold_map_and_summaries.py
            base_parameters: *params

        - task_key: gold_event_context
          depends_on:
            - task_key: bronze_usgs_context
          notebook_task:
            notebook_path: ../src/gold/gold_event_context.py
            base_parameters: *params

        - task_key: export_geojson
          depends_on:
            - task_key: gold_map_and_summaries
          notebook_task:
            notebook_path: ../src/export/export_geojson.py
            base_parameters: *params
